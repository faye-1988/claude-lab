<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>關於我</title>
  <style>
    :root {
      --ink: #1f1d2b;
      --muted: #6e6a80;
      --accent: #6d5dfc;
      --accent-2: #22c1c3;
      --card: rgba(255, 255, 255, 0.9);
      --radius-lg: 28px;
      --radius-md: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: var(--ink);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(circle at 15% 20%, rgba(255, 138, 171, 0.55), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(34, 193, 195, 0.5), transparent 45%),
        linear-gradient(135deg, #3b2a8f 0%, #6d5dfc 45%, #b06ab3 100%);
      background-attachment: fixed;
    }

    .card {
      width: 100%;
      max-width: 440px;
      overflow: hidden;
      background: var(--card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: var(--radius-lg);
      box-shadow:
        0 30px 60px -20px rgba(30, 20, 80, 0.45),
        0 0 0 1px rgba(255, 255, 255, 0.15) inset;
      animation: rise 0.7s cubic-bezier(.2, .8, .2, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to   { opacity: 1; transform: none; }
    }

    /* 頂部：漸層色帶 + 頭像 */
    .header {
      position: relative;
      padding: 0 32px 28px;
      text-align: center;
    }

    .header::before {
      content: "";
      display: block;
      height: 96px;
      margin: 0 -32px;
      background: linear-gradient(120deg, var(--accent), #b06ab3 60%, var(--accent-2));
    }

    .avatar {
      width: 104px;
      height: 104px;
      margin: -52px auto 16px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 42px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border: 5px solid #fff;
      box-shadow: 0 10px 25px -8px rgba(109, 93, 252, 0.6);
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      line-height: 1.2;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 1rem;
      color: var(--muted);
    }

    /* 內容區 */
    .section {
      padding: 0 32px 28px;
    }

    h2 {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: var(--accent);
    }

    h2::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(109, 93, 252, 0.35), transparent);
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      list-style: none;
    }

    .tags li {
      padding: 8px 16px;
      font-size: 0.95rem;
      font-weight: 500;
      border-radius: 999px;
      background: #f3f1ff;
      color: #3d3570;
      border: 1px solid #e4e0ff;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      cursor: default;
    }

    .tags li:hover {
      transform: translateY(-2px);
      background: #fff;
      box-shadow: 0 8px 18px -8px rgba(109, 93, 252, 0.5);
    }

    blockquote {
      margin: 0 32px 32px;
      padding: 20px 22px 20px 24px;
      font-size: 1.05rem;
      font-weight: 500;
      line-height: 1.8;
      color: #2e2a44;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #f5f3ff, #ecfcfc);
      border-left: 4px solid var(--accent);
    }

    @media (max-width: 420px) {
      .header, .section { padding-left: 22px; padding-right: 22px; }
      .header::before { margin: 0 -22px; }
      blockquote { margin-left: 22px; margin-right: 22px; }
      h1 { font-size: 1.75rem; }
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="header">
      <div class="avatar">S</div>
      <h1>Sean</h1>
      <p class="subtitle">很高興認識你 👋</p>
    </header>

    <section class="section">
      <h2>興趣</h2>
      <ul class="tags">
        <li>✈️ 旅行</li>
        <li>📷 攝影</li>
        <li>🎧 音樂</li>
        <li>📚 閱讀</li>
        <li>🍜 美食探索</li>
      </ul>
    </section>

    <blockquote>
      保持好奇，持續前進，每一天都是新的冒險。
    </blockquote>
  </main>
</body>
</html>
